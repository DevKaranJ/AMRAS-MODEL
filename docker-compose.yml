version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./storage:/app/storage
    env_file:
      - .env
    environment:
      # Override DB URL to use a Docker-managed volume path for SQLite,
      # or remove this line and set DB__URL in your .env for PostgreSQL.
      - DB__URL=sqlite+aiosqlite:////app/dev.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "X-API-Key: ${AMRAS_API_KEY:?AMRAS_API_KEY must be set}", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
